server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Used only when the frontend calls the relative "/api" path — i.e. when
    # BACKEND_URL wasn't set at container start (see docker-entrypoint.sh).
    # That's the Docker Compose case: "backend" resolves on the internal
    # Compose network. If BACKEND_URL IS set (e.g. on Render, pointing at a
    # separate public backend service), the frontend calls that URL directly
    # and this proxy block is simply never hit.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
