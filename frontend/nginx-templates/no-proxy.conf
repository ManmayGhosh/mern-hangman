server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No /api proxy block here on purpose: BACKEND_URL was set at container
    # start (see docker-entrypoint.sh), so the frontend calls that backend's
    # public URL directly from the browser instead of going through nginx.
    # This matters on Render (and similar platforms): nginx resolves every
    # proxy_pass hostname at STARTUP, so a proxy block pointing at a
    # Docker-Compose-only hostname like "backend" would crash nginx here,
    # even though no request would ever actually hit it.
}
